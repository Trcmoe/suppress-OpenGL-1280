name: build
on:
  push:
  pull_request:
permissions:
  contents: read
run-name: Does it build?
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: "temurin"
      - name: setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
